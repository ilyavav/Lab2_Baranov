info:
  name: Add Car
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:7175/api/Cars
  body:
    type: json
    data: |-
      {
        "id": 0,
        "clientId": 2,
        "brand": "Toyota",
        "model": "Camry",
        "year": 2020,
        "licensePlate": "A123BC77",
        "mileage": 65000
